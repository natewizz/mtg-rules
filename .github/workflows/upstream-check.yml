name: Upstream parser check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fetch and validate current Wizards source
        run: |
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          node dist/cli.js fetch -o "$tmp_dir/MagicCompRules.txt"
          node dist/cli.js doctor "$tmp_dir/MagicCompRules.txt" --json > "$tmp_dir/report.json"
          node -e "const fs = require('node:fs'); const report = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); if (!report.valid) process.exit(1); console.log(JSON.stringify({version: report.version, effectiveDate: report.document.effectiveDate, sourceSha256: report.document.sourceSha256, rules: report.document.rules, glossaryEntries: report.document.glossaryEntries, errors: report.errors.length, warnings: report.warnings.length}))" "$tmp_dir/report.json"
